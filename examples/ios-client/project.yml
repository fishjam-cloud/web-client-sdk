name: FishjamExample
options:
  bundleIdPrefix: io.fishjam.ios
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  SWIFT_STRICT_CONCURRENCY: minimal
  IPHONEOS_DEPLOYMENT_TARGET: "15.0"
  CODE_SIGNING_ALLOWED: NO
  "CODE_SIGNING_ALLOWED[sdk=iphoneos*]": YES
  CODE_SIGN_STYLE: Automatic
  DEVELOPMENT_TEAM: J5FM626PE2
  EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
projectReferences:
  FishjamClient:
    path: ../../packages/ios-client/FishjamClient.xcodeproj
targets:
  FishjamExample:
    type: application
    platform: iOS
    sources:
      - path: FishjamExample
    info:
      path: FishjamExample/Info.plist
      properties:
        UIBackgroundModes: [audio, voip]
        RTCAppGroupIdentifier: group.io.fishjam.example.voipcall
        RTCScreenSharingExtension: io.fishjam.example.voipcall.ScreenBroadcastExtension
        NSLocalNetworkUsageDescription: Fishjam example talks to the local VoIP test server on your Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: FishjamExample/FishjamExample.entitlements
      properties:
        com.apple.security.application-groups: [group.io.fishjam.example.voipcall]
        aps-environment: development
    dependencies:
      - target: FishjamClient/FishjamClient
        embed: true
      - framework: ../../packages/ios-client/Vendor/WebRTC.xcframework
        embed: true
      - target: ScreenBroadcastExtension
        embed: true
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_CFBundleDisplayName: Fishjam Example
      INFOPLIST_KEY_NSCameraUsageDescription: Fishjam uses the camera to send video.
      INFOPLIST_KEY_NSMicrophoneUsageDescription: Fishjam uses the microphone to send audio.
      PRODUCT_BUNDLE_IDENTIFIER: io.fishjam.example.voipcall
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: FishjamExample/FishjamExample.entitlements
      DEVELOPMENT_TEAM: J5FM626PE2
      TARGETED_DEVICE_FAMILY: "1,2"
  ScreenBroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ScreenBroadcastExtension
        excludes:
          - Info.plist
          - "*.entitlements"
    info:
      path: ScreenBroadcastExtension/Info.plist
      properties:
        CFBundleDisplayName: ScreenBroadcast
        RTCAppGroupIdentifier: group.io.fishjam.example.voipcall
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: ScreenBroadcastExtension/ScreenBroadcastExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.io.fishjam.example.voipcall]
    dependencies:
      - sdk: ReplayKit.framework
    settings:
      GENERATE_INFOPLIST_FILE: NO
      PRODUCT_BUNDLE_IDENTIFIER: io.fishjam.example.voipcall.ScreenBroadcastExtension
      INFOPLIST_FILE: ScreenBroadcastExtension/Info.plist
      CODE_SIGN_ENTITLEMENTS: ScreenBroadcastExtension/ScreenBroadcastExtension.entitlements
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: J5FM626PE2
      TARGETED_DEVICE_FAMILY: "1,2"
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      SKIP_INSTALL: YES
schemes:
  FishjamExample:
    build:
      targets:
        FishjamExample: all
        ScreenBroadcastExtension: all
    run:
      config: Debug
