syntax = "proto3";

package fishjam.sdk;

// Bytes passed to fishjam_client_new.
message ClientConfig {
  string fishjam_id = 1;
  bool debug = 2;
  // "android" or "ios". Auth sends "<client_type>-<fishjam-core version>".
  string client_type = 3;
  // Omit for defaults (enabled, 3 attempts, 500ms/500ms delays, offline
  // timeout 60s, tracks republished). Set `enabled = false` to turn it off.
  ReconnectConfig reconnect_config = 4;
  // Omit for the caps below. Each value is kbps, where 1 kbps = 1024 bps.
  // 0 means that cap. A higher value is clamped to the cap.
  BandwidthLimits bandwidth_limits = 5;
  // Omit for three camera layers. `single` sends the camera as one encoding.
  VideoConfig video_config = 6;
}

// App limits for outgoing video. 0 uses the cap: 1500 kbps for one encoding,
// and 150 / 500 / 1500 kbps for the low / medium / high layers.
message BandwidthLimits {
  uint32 single_stream_kbps = 1;
  uint32 low_kbps = 2;
  uint32 medium_kbps = 3;
  uint32 high_kbps = 4;
}

enum VideoSendMode {
  VIDEO_SEND_MODE_UNSPECIFIED = 0;
  VIDEO_SEND_MODE_SIMULCAST = 1;
  VIDEO_SEND_MODE_SINGLE = 2;
}

// Which camera layers to send. Unspecified and an empty `sent_qualities`
// list both mean low, medium, and high. A layer left out stays in the offer
// with `active = false`. Other video tracks ignore this and send one encoding.
message VideoConfig {
  VideoSendMode mode = 1;
  repeated Variant sent_qualities = 2;
}

message ReconnectConfig {
  bool enabled = 1;
  uint32 max_attempts = 2;
  uint32 initial_delay_ms = 3;
  uint32 delay_ms = 4;
  bool add_tracks_on_reconnect = 5;
  uint32 offline_timeout_ms = 6;
}

// Bytes passed to fishjam_client_call.
message SdkRequest {
  reserved 1;
  oneof content {
    JoinRoom join_room = 2;
    LeaveRoom leave_room = 3;
    AddTrack add_track = 4;
    RemoveTrack remove_track = 5;
    CreateOfferResult create_offer_result = 6;
    SetLocalDescriptionResult set_local_description_result = 7;
    SetRemoteDescriptionResult set_remote_description_result = 8;
    AddIceCandidateResult add_ice_candidate_result = 9;
    LocalIceCandidate local_ice_candidate = 10;
    RemoteTrackReady remote_track_ready = 11;
    PeerConnectionStateChanged peer_connection_state_changed = 12;
    NetworkStatusChanged network_status_changed = 13;
    UpdatePeerMetadata update_peer_metadata = 14;
    SetTrackBandwidth set_track_bandwidth = 15;
    SetEncodingBandwidth set_encoding_bandwidth = 16;
    SetTargetTrackVariant set_target_track_variant = 17;
  }
}

// One number, or one number per layer. 0 means the cap for that video limit.
// A per-layer list on an audio track is an error. Audio keeps the number as given.
message SetTrackBandwidth {
  string track_id = 1;
  optional uint32 single_kbps = 2;
  repeated LayerBandwidth layers = 3;
}

message LayerBandwidth {
  Variant variant = 1;
  uint32 kbps = 2;
}

message SetEncodingBandwidth {
  string track_id = 1;
  Variant variant = 2;
  uint32 kbps = 3;
}

message SetTargetTrackVariant {
  string track_id = 1;
  Variant variant = 2;
}

// Bytes written to FishjamBuf by fishjam_client_call.
message SdkResponse {
  reserved 2;
  oneof content {
    Error error = 1;
    Empty empty = 3;
    AddTrackResult add_track = 4;
    RoomState room_state = 5;
  }
}

// Bytes passed to FishjamOnEvent. The pointer is valid only for that call.
message SdkEvent {
  oneof content {
    PeerStatusChanged peer_status_changed = 1;
    RoomStateChanged room_state_changed = 2;
    CreatePeerConnection create_peer_connection = 3;
    UpdateRecvonlyTransceivers update_recvonly_transceivers = 4;
    AddSendonlyTransceiver add_sendonly_transceiver = 5;
    RemoveSendTrack remove_send_track = 6;
    CreateOffer create_offer = 7;
    SetLocalDescription set_local_description = 8;
    SetRemoteDescription set_remote_description = 9;
    AddIceCandidate add_ice_candidate = 10;
    ClosePeerConnection close_peer_connection = 11;
    PeerJoined peer_joined = 12;
    PeerLeft peer_left = 13;
    PeerUpdated peer_updated = 14;
    TrackAdded track_added = 15;
    TrackReady track_ready = 16;
    TrackRemoved track_removed = 17;
    TrackUpdated track_updated = 18;
    ReconnectionStatusChanged reconnection_status_changed = 19;
    UpdateSendEncodings update_send_encodings = 20;
  }
}

message UpdateSendEncodings {
  string track_id = 1;
  repeated SendEncoding send_encodings = 2;
}

message JoinRoom {
  string peer_token = 1;
  string peer_metadata_json = 2;
}

// The peer part only. The server wraps it as {"peer": …, "server": …}.
message UpdatePeerMetadata {
  string peer_metadata_json = 1;
}

message LeaveRoom {}

message Empty {}

enum AuthErrorReason {
  AUTH_ERROR_REASON_UNSPECIFIED = 0;
  AUTH_ERROR_REASON_MISSING_TOKEN = 1;
  AUTH_ERROR_REASON_INVALID_TOKEN = 2;
  AUTH_ERROR_REASON_EXPIRED_TOKEN = 3;
  AUTH_ERROR_REASON_ROOM_NOT_FOUND = 4;
  AUTH_ERROR_REASON_PEER_NOT_FOUND = 5;
}

enum JoinErrorReason {
  JOIN_ERROR_REASON_UNSPECIFIED = 0;
  JOIN_ERROR_REASON_REACHED_PEERS_LIMIT = 1;
  JOIN_ERROR_REASON_ROOM_NOT_FOUND = 2;
  JOIN_ERROR_REASON_NODE_NOT_FOUND = 3;
  JOIN_ERROR_REASON_INVALID_SDK_VERSION = 4;
}

message Error {
  string message = 1;
  string auth_reason = 2;
  string join_reason = 3;
  AuthErrorReason auth_error_reason = 4;
  JoinErrorReason join_error_reason = 5;
}

enum TrackKind {
  TRACK_KIND_UNSPECIFIED = 0;
  TRACK_KIND_AUDIO = 1;
  TRACK_KIND_VIDEO = 2;
}

enum TrackType {
  TRACK_TYPE_UNSPECIFIED = 0;
  TRACK_TYPE_CAMERA = 1;
  TRACK_TYPE_MICROPHONE = 2;
  TRACK_TYPE_SCREEN_SHARE_VIDEO = 3;
  TRACK_TYPE_SCREEN_SHARE_AUDIO = 4;
  TRACK_TYPE_CUSTOM_VIDEO = 5;
  TRACK_TYPE_CUSTOM_AUDIO = 6;
}

// Same values as fishjam.media_events.Variant.
enum Variant {
  VARIANT_UNSPECIFIED = 0;
  VARIANT_LOW = 1;
  VARIANT_MEDIUM = 2;
  VARIANT_HIGH = 3;
}

message TrackMetadata {
  TrackType type = 1;
  bool paused = 2;
  optional string display_name = 3;
}

message AddTrack {
  TrackKind kind = 1;
  TrackMetadata metadata = 2;
}

message RemoveTrack {
  string track_id = 1;
}

message AddTrackResult {
  string track_id = 1;
}

enum PeerStatus {
  PEER_STATUS_UNSPECIFIED = 0;
  PEER_STATUS_IDLE = 1;
  PEER_STATUS_CONNECTING = 2;
  PEER_STATUS_CONNECTED = 3;
  PEER_STATUS_ERROR = 4;
}

message PeerStatusChanged {
  PeerStatus peer_status = 1;
  Error error = 2;
}

// Separate from PeerStatus: a reconnect attempt in progress does not flip
// PeerStatus away from its last good value until it either succeeds or the
// whole reconnection gives up.
enum ReconnectionStatus {
  RECONNECTION_STATUS_IDLE = 0;
  RECONNECTION_STATUS_RECONNECTING = 1;
  RECONNECTION_STATUS_ERROR = 2;
}

message ReconnectionStatusChanged {
  ReconnectionStatus status = 1;
}

enum NegotiationStatus {
  NEGOTIATION_STATUS_UNSPECIFIED = 0;
  NEGOTIATION_STATUS_AWAITING = 1;
  NEGOTIATION_STATUS_OFFERED = 2;
  NEGOTIATION_STATUS_DONE = 3;
}

message SimulcastConfig {
  bool enabled = 1;
  repeated Variant enabled_variants = 2;
  repeated Variant disabled_variants = 3;
}

message TrackState {
  string track_id = 1;
  TrackMetadata metadata = 2;
  SimulcastConfig simulcast_config = 3;
  NegotiationStatus negotiation_status = 4;
  Variant encoding = 5;
  bool ready = 6;
}

message PeerState {
  string id = 1;
  string metadata_json = 2;
  repeated TrackState tracks = 3;
  optional TrackState camera_track = 4;
  optional TrackState microphone_track = 5;
  optional TrackState screen_share_video_track = 6;
  optional TrackState screen_share_audio_track = 7;
  repeated TrackState custom_video_tracks = 8;
  repeated TrackState custom_audio_tracks = 9;
}

message RoomState {
  optional PeerState local_peer = 1;
  repeated PeerState remote_peers = 2;
}

message RoomStateChanged {
  RoomState room_state = 1;
}

message PeerJoined {
  optional PeerState peer = 1;
}

message PeerLeft {
  optional PeerState peer = 1;
}

message PeerUpdated {
  optional PeerState peer = 1;
}

message TrackAdded {
  string peer_id = 1;
  optional TrackState track = 2;
}

message TrackReady {
  string peer_id = 1;
  optional TrackState track = 2;
}

message TrackRemoved {
  string peer_id = 1;
  optional TrackState track = 2;
}

message TrackUpdated {
  string peer_id = 1;
  optional TrackState track = 2;
}

message IceServer {
  string credential = 1;
  repeated string urls = 2;
  string username = 3;
}

message CreatePeerConnection {
  repeated IceServer ice_servers = 1;
}

message UpdateRecvonlyTransceivers {
  int32 video_to_add = 1;
  int32 audio_to_add = 2;
  repeated string mids_to_stop = 3;
}

message SendEncoding {
  string rid = 1;
  bool active = 2;
  double scale_resolution_down_by = 3;
  uint32 max_bitrate = 4;
}

message AddSendonlyTransceiver {
  string track_id = 1;
  TrackKind kind = 2;
  repeated SendEncoding send_encodings = 3;
}

message RemoveSendTrack {
  string track_id = 1;
}

message CreateOffer {}

message CreateOfferResult {
  string sdp = 1;
}

enum SdpType {
  SDP_TYPE_UNSPECIFIED = 0;
  SDP_TYPE_OFFER = 1;
  SDP_TYPE_ANSWER = 2;
}

message SetLocalDescription {
  SdpType type = 1;
  string sdp = 2;
}

message SetLocalDescriptionResult {
  map<string, string> mid_to_track_id = 1;
}

message SetRemoteDescription {
  SdpType type = 1;
  string sdp = 2;
  map<string, string> mid_to_track_id = 3;
}

message SetRemoteDescriptionResult {}

message AddIceCandidate {
  string candidate = 1;
  string sdp_mid = 2;
  int32 sdp_m_line_index = 3;
  string username_fragment = 4;
}

message AddIceCandidateResult {}

message LocalIceCandidate {
  string candidate = 1;
  string sdp_mid = 2;
  int32 sdp_m_line_index = 3;
  string username_fragment = 4;
}

message RemoteTrackReady {
  string mid = 1;
}

message PeerConnectionStateChanged {
  string connection_state = 1;
  string ice_connection_state = 2;
}

message ClosePeerConnection {}

// Reported by the native layer when the OS's default network path changes.
// `network_id` identifies which network is current (opaque, e.g. interface
// type); empty when offline. Used to tell "lost", "available" and "changed
// to a different network" apart.
message NetworkStatusChanged {
  bool online = 1;
  string network_id = 2;
}
